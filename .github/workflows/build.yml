name: Android build
on:
    workflow_dispatch:
    push:
        branches: [main]
        paths-ignore: ['docs/**', 'README.md']
permissions:
    contents: read
jobs:
    android:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21
            - run: npm ci --no-audit --no-fund
            - run: npm run typecheck
            - run: npm test
            - run: npm run lint
            - uses: android-actions/setup-android@v3
            - run: sdkmanager "ndk;27.1.12297006"
            - run: python3 scripts/prepare-release-apk.py --sdk "$ANDROID_HOME"
            - run: npx expo prebuild --platform android --no-install --no-clean
            - name: Build APK
              working-directory: android
              env:
                  NODE_ENV: production
              run: chmod +x gradlew && ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --console=plain
            - uses: actions/upload-artifact@v4
              with:
                  name: MingYue-Android-CI
                  path: android/app/build/outputs/apk/release/*.apk
                  if-no-files-found: error
